name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --platforms=android /tmp/app

      - name: Copy lib
        run: cp -r lib /tmp/app/

      - name: Copy pubspec
        run: cp pubspec.yaml /tmp/app/

      - name: Copy assets
        run: |
          if [ -d "assets" ]; then
            cp -r assets /tmp/app/
          fi

      - name: Get dependencies
        working-directory: /tmp/app
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: activity-report-app-release
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
