name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --platforms=android /tmp/activity_app

      - name: Copy lib
        run: cp -r "$GITHUB_WORKSPACE/lib" /tmp/activity_app/

      - name: Copy pubspec
        run: cp "$GITHUB_WORKSPACE/pubspec.yaml" /tmp/activity_app/

      - name: Copy assets
        run: |
          if [ -d "$GITHUB_WORKSPACE/assets" ]; then
            cp -r "$GITHUB_WORKSPACE/assets" /tmp/activity_app/
          fi

      - name: Get dependencies
        working-directory: /tmp/activity_app
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/activity_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: activity-report-app-release
          path: /tmp/activity_app/build/app/outputs/flutter-apk/app-release.apk
