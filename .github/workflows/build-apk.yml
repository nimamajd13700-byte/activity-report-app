name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create --project-name activity_report_app /tmp/flutter_app

      - name: Replace Flutter demo with our app
        run: |
          rm -rf /tmp/flutter_app/lib
          cp -r ./lib /tmp/flutter_app/lib
          cp ./pubspec.yaml /tmp/flutter_app/pubspec.yaml

      - name: Verify project files
        run: |
          echo "===== main.dart ====="
          head -40 /tmp/flutter_app/lib/main.dart
          echo "===== pubspec.yaml ====="
          cat /tmp/flutter_app/pubspec.yaml

      - name: Get dependencies
        working-directory: /tmp/flutter_app
        run: flutter pub get

      - name: Check Flutter project
        working-directory: /tmp/flutter_app
        run: flutter doctor -v

      - name: Build APK with detailed logs
        working-directory: /tmp/flutter_app
        run: flutter build apk --release --verbose

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: activity-report-apk
          path: /tmp/flutter_app/build/app/outputs/flutter-apk/app-release.apk
